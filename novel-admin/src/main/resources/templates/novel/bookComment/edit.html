<!DOCTYPE html><html><head th:include="include :: header"></head><body>
<form id="signupForm"><input type="hidden" name="id" th:value="${bookComment.id}"><input type="hidden" name="moderationVersion" th:value="${bookComment.moderationVersion}">
<label>评论正文（修改后重新待审核，最多512字）</label><textarea name="commentContent" th:text="${bookComment.commentContent}"></textarea><button type="submit">提交</button></form>
<div th:include="include :: footer"></div><script>$('#signupForm').on('submit',function(e){e.preventDefault();$.post('/novel/bookComment/update',$(this).serialize(),function(r){if(r.code===0){parent.reLoad();parent.layer.close(parent.layer.getFrameIndex(window.name));}else layer.alert(r.msg);},'json');});</script></body></html>
