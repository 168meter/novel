server {
    listen 80 default_server;
    server_name _;

    # Future certificate mounts, enabled only after a real certificate exists:
    # ./deploy/certbot/conf:/etc/letsencrypt:ro
    # ./deploy/certbot/www:/var/www/certbot:ro

    location = /actuator { return 404; }
    location ^~ /actuator/ { return 404; }

    # Static assets use a separate, wider budget so shared NAT users do not
    # consume the dynamic request burst while random asset paths remain bounded.
    location ~* "^/(?:css|images|javascript|js|layui|mobile)/[^;]*\.(?:css|js|mjs|png|jpe?g|gif|svg|ico|woff2?)$" {
        limit_req zone=static_assets burst=200 nodelay;
        limit_conn per_ip 30;

        proxy_pass http://novel-front:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_cache off;
    }

    location / {
        limit_req zone=public_api burst=40 nodelay;
        limit_conn per_ip 30;

        proxy_pass http://novel-front:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_cache off;
    }
}
