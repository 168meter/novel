# Example only. Do not copy this file into conf.d until YOUR_DOMAIN has a real
# certificate mounted read-only at /etc/letsencrypt.
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    location = /actuator { return 404; }
    location ^~ /actuator/ { return 404; }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|ico|woff2?)$ {
        limit_req zone=static_assets burst=200 nodelay;
        limit_conn per_ip 30;

        proxy_pass http://novel-front:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_cache off;
    }

    location / {
        limit_req zone=public_api burst=40 nodelay;
        limit_conn per_ip 30;

        proxy_pass http://novel-front:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_cache off;
    }
}
