<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head th:replace="common/header :: common_head(~{::title},~{::meta},~{::link},~{})">
    <title th:text="'找回密码_'+${application.website.name}"></title>
    <meta name="keywords" content="找回密码" />
    <meta name="description" content="通过邮箱验证码重置密码" />
    <link rel="stylesheet" href="/css/user.css" />
</head>
<body>
<div th:replace="common/top :: top('')"></div>
<div class="main box_center cf"><div class="userBox cf"><div class="user_l">
    <form id="resetForm" action="" onsubmit="return false;">
        <h3>找回密码</h3>
        <ul class="log_list">
            <li><span id="resetError"></span></li>
            <li><input name="email" type="email" id="resetEmail" maxlength="254" autocomplete="email"
                       placeholder="邮箱" class="s_input icon_name" /></li>
            <li class="log_code cf">
                <input name="code" type="text" id="resetCode" maxlength="6" inputmode="numeric"
                       autocomplete="one-time-code" placeholder="6位邮件验证码" class="s_input icon_code" />
                <input type="button" id="resetSendCode" value="发送验证码" class="s_btn" />
            </li>
            <li><input name="password" type="password" id="resetPassword" maxlength="64" autocomplete="new-password"
                       placeholder="新密码（8-64字符）" class="s_input icon_key" /></li>
            <li><input name="confirmPassword" type="password" id="resetConfirmPassword" maxlength="64"
                       autocomplete="new-password" placeholder="确认新密码" class="s_input icon_key" /></li>
            <li><input type="button" value="重置密码" id="btnResetPassword" class="btn_red" /></li>
            <li><a href="/user/login.html">返回登录</a></li>
        </ul>
    </form>
</div></div></div>
<div th:replace="common/footer :: footer"></div>
<div th:replace="common/js :: js"></div>
<script type="text/javascript" src="/javascript/user.js"></script>
<script type="text/javascript">AuthPage.initPasswordReset();</script>
</body>
</html>
