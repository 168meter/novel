<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${errorStatus == null or errorStatus == 404} ? '页面不存在' : '暂时无法打开页面'">页面不存在</title>
    <style>
        body { margin: 0; background: #f5f5f5; color: #333; font: 16px/1.8 Arial, sans-serif; }
        main { max-width: 560px; margin: 12vh auto; padding: 32px; background: #fff; text-align: center; }
        h1 { font-size: 26px; }
        p { color: #666; }
        a { display: inline-block; margin-top: 12px; padding: 8px 24px; background: #f65167; color: #fff; text-decoration: none; border-radius: 3px; }
        a:focus-visible { outline: 3px solid #333; outline-offset: 3px; }
    </style>
</head>
<body>
<main>
    <h1 th:text="${errorStatus == null or errorStatus == 404} ? '页面不存在' : '暂时无法打开页面'">页面不存在</h1>
    <p th:text="${errorStatus == null or errorStatus == 404} ? '页面或内容不存在，可能已经移除，或链接有误。' : '当前请求暂时无法完成，请稍后重试。'">页面或内容不存在，可能已经移除，或链接有误。</p>
    <a href="/">返回首页</a>
</main>
</body>
</html>
