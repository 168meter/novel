<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head th:replace="common/header :: common_head(~{::title},~{},~{::link},~{})">
    <title th:text="'我的书评_'+${application.website.name}"></title>
    <link rel="stylesheet" href="/css/user.css"/>
</head>
<body class="">

<div th:replace="common/top :: top('')">
</div>
<div class="main box_center cf">
    <div class="userBox cf">
        <div class="my_l">

            <ul class="log_list">
                <li><a class="link_1 " href="/user/userinfo.html">个人中心</a></li>
                <li><a class="link_4" href="/user/favorites.html">我的书架</a></li>
                <li><a class="link_6 on" href="/user/comment.html">我的书评</a></li>
                <li><a class="link_7 " href="/user/feedback_list.html">我的反馈</a></li>
                <li><a class="link_8 " href="/user/setup.html">账号设置</a></li>
            </ul>

        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div class="title cf">
                    <h2 class="fl">我的书评</h2>
                    <div class="fr"><button type="button" onclick="showReplies=false;search(1,5)">我的书评</button> <button type="button" onclick="showReplies=true;search(1,5)">我的回复</button></div>
                </div>
                <div class="bookComment">
                    <div class="no_contet no_comment" style="display:none">
                        您还没有发表过评论！
                    </div>
                    <div class="commentBar" id="commentBar">


                    </div>
                </div>
                <div class="pageBox cf" id="commentPage">
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="common/footer :: footer">
</div>
<div th:replace="common/js :: js"></div>
<script src="/javascript/comment-moderation.js"></script>
<script>
var showReplies=false,requestSequence=0;
function search(curr,limit) {
  var reply=showReplies,sequence=++requestSequence;
  $.ajax({type:'GET',url:'/user/'+(reply?'listReplyByPage':'listCommentByPage'),data:{curr:curr,limit:limit},dataType:'json',success:function(result){
    if(sequence!==requestSequence || reply!==showReplies)return;
    if(result.code!==200){layer.alert(result.msg);return;}
    var panel=$('#commentBar').empty();
    if(!result.data.list.length) panel.text(reply?'暂无回复':'暂无书评');
    result.data.list.forEach(function(row){
      var item=$('<div class="comment_list"></div>');
      $('<p></p>').text(ModerationUI.status(row.auditStatus)+(reply && row.parentAuditStatus!==1?' · 所属评论暂不可见':'')).appendTo(item);
      $('<p></p>').text(reply?row.replyContent:row.commentContent).appendTo(item);
      $('<span></span>').text(row.createTime).appendTo(item);
      $('<button type="button">修改并重新提交</button>').on('click',function(){ModerationUI.edit(reply,row.id,row.moderationVersion,reply?row.replyContent:row.commentContent,function(){search(curr,limit);});}).appendTo(item);
      item.appendTo(panel);
    });
    layui.use('laypage',function(){layui.laypage.render({elem:'commentPage',count:result.data.total,curr:result.data.pageNum,limit:result.data.pageSize,jump:function(obj,first){if(!first)search(obj.curr,obj.limit);}});});
  },error:function(){layer.alert('网络异常');}});
}
search(1,5);
</script>
</body>
</html>
