groups:
  - name: novel-plus
    rules:
      - alert: NovelFrontDown
        expr: (up{job="novel-front"} == 0) or absent(up{job="novel-front"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Novel front is unavailable
          description: Prometheus has been unable to scrape novel-front for one minute.

      - alert: ChapterCacheErrors
        expr: >-
          sum by (job, instance) (increase(novel_chapter_cache_lookup_total{job="novel-front", result="error"}[5m]))
          + sum by (job, instance) (increase(novel_chapter_cache_write_total{job="novel-front", result="error"}[5m]))
          + sum by (job, instance) (increase(novel_chapter_cache_lock_total{job="novel-front", result="error"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Chapter cache errors detected
          description: A chapter cache lookup, write, or lock operation failed during the last five minutes.

      - alert: LowChapterCacheHitRate
        expr: >-
          sum by (job, instance) (increase(novel_chapter_cache_lookup_total{job="novel-front", result="hit"}[5m]))
          / sum by (job, instance) (increase(novel_chapter_cache_lookup_total{job="novel-front"}[5m])) < 0.90
          and sum by (job, instance) (increase(novel_chapter_cache_lookup_total{job="novel-front"}[5m])) >= 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Chapter cache hit rate is low
          description: Request-level chapter cache hit rate stayed below 90 percent with at least 100 lookups.

      - alert: KafkaPublishFailures
        expr: sum by (job, instance) (increase(novel_book_visit_kafka_send_total{job="novel-front", result="failed"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Kafka publishing failures detected
          description: At least one book visit event failed to publish during the last five minutes.

      - alert: ReadingEngagementRedisErrors
        expr: sum by (job, instance) (increase(novel_reading_heartbeat_total{job="novel-front", result="redis_error"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Reading engagement Redis errors detected
          description: The five-minute reading gate error signal has remained positive for one minute.

      - alert: ReadingEngagementKafkaPublishFailures
        expr: sum by (job, instance) (increase(novel_reading_kafka_send_total{job="novel-front", result="failed"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Reading engagement Kafka publishing failed
          description: At least one accepted reading credit failed to publish during the last five minutes.

      - alert: KafkaConsumerLagHigh
        expr: sum by (job, instance) (kafka_consumer_fetch_manager_records_lag{job="novel-front", topic="novel-book-visit-v1"}) > 10000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Kafka consumer lag is high
          description: Book visit client fetch lag per application instance stayed above 10000 records; this is not committed group or database lag.

      - alert: HikariPendingConnections
        expr: sum by (job, instance) (hikaricp_connections_pending{job="novel-front"}) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Database connections are pending
          description: Requests have waited for a HikariCP database connection for one minute.

      - alert: JvmHeapUsageHigh
        expr: >-
          sum by (job, instance) (jvm_memory_used_bytes{job="novel-front", area="heap"})
          / sum by (job, instance) (jvm_memory_max_bytes{job="novel-front", area="heap"} > 0) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: JVM heap usage is high
          description: JVM heap usage stayed above 85 percent for five minutes.

      - alert: FrontExecutorRejectedTasks
        expr: increase(novel_front_executor_rejections_total{job="novel-front"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Front executor rejected tasks
          description: The shared front-end executor rejected at least one task during the last five minutes.

      - alert: FrontExecutorQueueSaturated
        expr: >-
          executor_queue_remaining_tasks{job="novel-front", name="novel.front.executor"} == 0
          and executor_queued_tasks{job="novel-front", name="novel.front.executor"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Front executor queue is saturated
          description: The shared front-end executor queue had no remaining capacity for one minute.

      - alert: ReadingConsumerLagHigh
        expr: sum by (job, instance) (kafka_consumer_fetch_manager_records_lag{job="novel-front", topic="novel-reading-engagement-v1"}) > 10000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Reading consumer lag is high
          description: Reading client fetch lag per application instance is high; this is not committed group or database lag.

      - alert: ReadingConsumerDltGrowth
        expr: sum by (job, instance) (increase(novel_reading_kafka_dlt_total{job="novel-front"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Reading events moved to DLT
          description: Reading events moved to DLT; inspect the reading consumer and cleanup metrics.

      - alert: ReadingConsumerRetries
        expr: sum by (job, instance) (rate(novel_reading_kafka_retry_total{job="novel-front"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Reading consumer is retrying
          description: Reading consumer is retrying; inspect the reading consumer and cleanup metrics.

      - alert: ReadingConsumerDltPublishFailures
        expr: sum by (job, instance) (increase(novel_reading_kafka_dlt_publish_failures_total{job="novel-front"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Reading DLT publishing failed
          description: Reading DLT publishing failed; inspect the reading consumer and cleanup metrics.

      - alert: ReadingDedupCleanupFailures
        expr: sum(increase(novel_reading_dedup_cleanup_failures_total[24h])) > 0
        labels:
          severity: warning
        annotations:
          summary: Reading dedup cleanup failed
          description: Reading dedup cleanup failed; inspect the reading consumer and cleanup metrics.

      - alert: HomeRecommendationRefreshDbErrors
        expr: sum by (job, instance) (increase(novel_home_recommendation_refresh_total{job="novel-front", result="db_error"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Home recommendation refresh database errors detected
          description: At least one home recommendation refresh failed before Redis publication during the last five minutes.

      - alert: HomeRecommendationSnapshotStale
        expr: max by (job, instance) (novel_home_recommendation_local_age_seconds{job="novel-front"}) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Home recommendation process-local snapshot is stale
          description: A novel-front process has reported a successful local recommendation snapshot older than fifteen minutes for five minutes; this gauge does not represent global distributed freshness.

      - alert: AuthenticationMailDeliveryFailures
        expr: sum(increase(novel_auth_mail_delivery_total{outcome="failed"}[5m])) >= 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Authentication email delivery is failing
          description: Authentication email delivery failures have continued for two minutes.

      - alert: AuthenticationMailQueueRejections
        expr: sum(increase(novel_auth_mail_delivery_total{outcome="rejected"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Authentication email queue rejected work
          description: The bounded authentication email executor rejected at least one task in five minutes.

      - alert: AuthenticationDependencyErrors
        expr: >-
          sum(increase(novel_auth_login_total{outcome="dependency_error"}[5m]))
          + sum(increase(novel_auth_captcha_request_total{outcome="dependency_error"}[5m]))
          + sum(increase(novel_auth_jwt_version_total{outcome="dependency_error"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Authentication dependency errors detected
          description: Login or verification-code requests encountered a dependency error in five minutes.

      - alert: AuthenticationLoginFailuresHigh
        expr: >-
          sum(rate(novel_auth_login_total{outcome=~"bad_credentials|account_limited|captcha_required|rate_limited"}[5m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Authentication login failures are unusually high
          description: Credential or rate-limit failures exceeded five requests per second for two minutes.

      - alert: AuthenticationPasswordUpgradeFailures
        expr: sum(increase(novel_auth_password_upgrade_total{outcome="failed"}[15m])) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Password upgrades are persistently failing
          description: Best-effort legacy password upgrades have continued failing for five minutes.

      - alert: ChapterHttp5xxHigh
        expr: >-
          sum by (job, instance) (rate(http_server_requests_seconds_count{job="novel-front", uri="/book/{bookId}/{bookIndexId}.html", method="GET", status=~"5.."}[5m])) / sum by (job, instance) (rate(http_server_requests_seconds_count{job="novel-front", uri="/book/{bookId}/{bookIndexId}.html", method="GET"}[5m])) > 0.05
          and sum by (job, instance) (rate(http_server_requests_seconds_count{job="novel-front", uri="/book/{bookId}/{bookIndexId}.html", method="GET"}[5m])) > 0
          and sum by (job, instance) (increase(http_server_requests_seconds_count{job="novel-front", uri="/book/{bookId}/{bookIndexId}.html", method="GET"}[5m])) >= 20
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Chapter HTTP server error rate is high
          description: Chapter GET 5xx ratio exceeded 5 percent with at least 20 requests in five minutes for one minute.

      - alert: ChapterHttp503Observed
        expr: >-
          sum by (job, instance) (increase(http_server_requests_seconds_count{job="novel-front", uri="/book/{bookId}/{bookIndexId}.html", method="GET", status="503"}[5m])) > 0
          and sum by (job, instance) (rate(http_server_requests_seconds_count{job="novel-front", uri="/book/{bookId}/{bookIndexId}.html", method="GET"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Chapter HTTP 503 responses observed
          description: A chapter GET returned 503 during an active five-minute request window; inspect shared executor rejection and capacity.

      - alert: ReadingConsumerMetricsMissing
        expr: >-
          up{job="novel-front"} == 1
          unless on (job, instance)
          (count by (job, instance) (kafka_consumer_connection_count{job="novel-front", spring_id=~"readingEngagementConsumerFactory[.].*"})
          and count by (job, instance) (kafka_consumer_fetch_manager_records_lag{job="novel-front", topic="novel-reading-engagement-v1"}))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Reading consumer metric input is missing
          description: A reachable application lacks reading consumer connection or topic fetch-lag series for five minutes. Check binding, assignment and whether the topic has received records; missing is not zero lag.
