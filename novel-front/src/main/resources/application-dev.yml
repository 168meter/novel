spring:
  config:
    import: classpath:application-common-dev.yml
  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 500
        request.timeout.ms: 1000
        delivery.timeout.ms: 3000
    consumer:
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      max-poll-records: 500
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.LongDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.java2nb.novel.event
        spring.json.value.default.type: com.java2nb.novel.event.BookVisitEvent
        spring.json.use.type.headers: false
    listener:
      type: batch
      ack-mode: batch

novel:
  auth:
    trusted-proxy-addresses:
      - 127.0.0.1
      - ::1
  kafka:
    book-visit:
      topic: novel-book-visit-v1
      dlt-topic: novel-book-visit-dlt
      group-id: novel-book-visit-writer-v1
      max-poll-records: 500


pic:
  save:
    type: 1 #图片保存方式, 1不保存，使用爬取的网络图片 ，2保存在自己的存储介质
    storage: local #存储介质，local：本地，OSS：阿里云对象存储
    path: /Users/xiongxiaoyang/java/  #图片保存路径



#线程池配置
thread:
  pool:
    #核心线程池数量
    core-pool-size: 10
    #最大线程池数量
    maximum-pool-size: 20
    #线程超时时间（秒）
    keep-alive-time: 10
    #队列大小
    queue-size: 100

management:
  server:
    port: 8084
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: novel-front
