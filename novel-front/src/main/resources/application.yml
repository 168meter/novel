server:
  port: 8083

spring:
  profiles:
    active: dev
    include: website,alipay,oss
  mail:
    host: smtp.163.com
    port: 465
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800

#缓存管理密码
cache:
  manager:
    password: ${CACHE_MANAGER_PASSWORD}

novel:
  auth:
    hmac-secret: ${NOVEL_AUTH_HMAC_SECRET}


# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接 （多个用逗号分隔）
  urlPatterns: /book/addCommentReply,/book/addBookComment,/user/addFeedBack,/author/addBook,/author/addBookContent,/author/updateBookContent,/author/register.html


author:
  income:
    #税率(扣税后所得比率)
    tax-rate: 0.9
    #分佣比例
    share-proportion: 0.7
    #兑换比率(人民币)
    exchange-proportion: 0.01

#小说章节定价规则
book:
  price:
    #字数
    word-count: 1000
    #价值(屋币)
    value: 5


--- #--------------------- Spring AI 配置----------------------
spring:
  ai:
    model:
      image: ${NOVEL_AI_MODEL_IMAGE:openai}
      chat: ${NOVEL_AI_MODEL_CHAT:openai}
    openai:
      image:
        base-url: https://api.siliconflow.cn
        api-key: ${NOVEL_AI_API_KEY:}
        options:
          model: Kwai-Kolors/Kolors
          response_format: URL
      api-key: ${NOVEL_AI_API_KEY:}
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B


